name: CI

on: [push]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false
    - uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
        python-version: '3.14'
    - name: Run tests
      run: uv run --locked pytest

  repo-review:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false
    - uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
        python-version: '3.14'
    - name: Check config
      run: uv run --locked repo-review .
