repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff
        args: ["--exclude", "*_test.py,test_utils.py"]
      - id: ruff-format
        args: ["--exclude", "*_test.py,test_utils.py"]
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.26.1
    hooks:
      - id: zizmor