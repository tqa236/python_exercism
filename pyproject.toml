[project]
name = "python-exercism"
version = "0.0.1"
description = "My solution for exercises of Python track on Exercism."
readme = "README.md"
requires-python = ">=3.14"
license = {file = "LICENSE.txt"}
keywords = []
authors = [
  {name = "Trinh Quoc Anh", email = "trinhquocanh94@gmail.com"},
]
maintainers = [
  {name = "Trinh Quoc Anh", email = "trinhquocanh94@gmail.com"},
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Build Tools",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Programming Language :: Python :: 3 :: Only",
]
dependencies = []

[dependency-groups]
dev = [{include-group = "test"}, {include-group = "lint"}]
test = ["pytest", "hypothesis"]
lint = ["sp-repo-review[cli]"]

[build-system]
requires = ["setuptools>=75.0.0"]
build-backend = "setuptools.build_meta"

[tool.uv]
package = false

[tool.setuptools]

[tool.pytest.ini_options]
minversion = "6"
testpaths = ["."]
python_files = ["*_test.py"]
addopts = ["-ra", "--strict-config", "--strict-markers"]
log_level = "INFO"
xfail_strict = true
filterwarnings = ["error"]
markers = ["task: A concept exercise task."]

[tool.repo-review]
ignore = ["PY004", "PY005", "PY007", "PP003", "PP301", "GH102", "GH103", "GH212", "PC", "MY", "RF", "RTD"]

[tool.ruff]
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
    # Tests are synchronized from Exercism
    "*_test.py",
]
line-length = 88
indent-width = 4
target-version = "py314"

[tool.ruff.lint]
select = ["D", "E4", "E7", "E9", "F"]
ignore = []
fixable = ["ALL"]
unfixable = []
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = false
docstring-code-line-length = "dynamic"
